<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b34"><link rel="manifest" href="manifest.webmanifest"><title>Grafik Kościelnego</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f5;color:#173b34}.wrap{max-width:480px;margin:auto;padding:22px}h1{font-size:1.65rem}.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 3px 18px #0001;margin:16px 0}.status{text-align:center;font-size:2rem;font-weight:800;padding:25px 8px;border-radius:15px}.free{background:#d9f5e3;color:#116235}.work{background:#fff0d5;color:#855000}input{width:100%;box-sizing:border-box;padding:14px;font-size:1.1rem;border:1px solid #bacac2;border-radius:10px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head button{border:0;border-radius:10px;background:#e2ebe6;padding:10px 14px;font-size:1.1rem}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar div{text-align:center;padding:10px 0;border-radius:8px;font-size:.9rem}.weekday{font-weight:bold;color:#68766f}.day{cursor:pointer}.today{outline:2px solid #173b34}small{color:#64756d}.legend{display:flex;gap:16px;font-size:.85rem;margin-top:14px}</style></head><body><main class="wrap"><h1>⛪ Grafik Kościelnego</h1><div class="panel"><small>Dzisiaj</small><p id="todayLabel"></p><div id="todayStatus" class="status"></div></div><div class="panel"><label for="date"><strong>Sprawdź dowolną datę</strong></label><p><input type="date" id="date"></p><div id="chosenStatus" class="status"></div></div><div class="panel"><div class="head"><button id="prev" aria-label="Poprzedni miesiąc">‹</button><strong id="monthLabel"></strong><button id="next" aria-label="Następny miesiąc">›</button></div><div class="calendar" id="calendar"></div><div class="legend"><span>🟩 Wolne</span><span>🟨 Praca</span></div></div><small>Stały cykl tygodniowy od poniedziałku do niedzieli. Urlopy i zastępstwa nie przesuwają grafiku.</small></main><script>const anchor=Date.UTC(2026,10,9),week=604800000;function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}function fmt(d){return [d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('-')}function free(d){let n=Math.floor((d.getTime()-anchor)/week);return ((n%2)+2)%2===0}function show(el,d){el.textContent=free(d)?'MASZ WOLNE':'PRACUJESZ';el.className='status '+(free(d)?'free':'work')}const today=new Date(),utcToday=new Date(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()));document.getElementById('todayLabel').textContent=utcToday.toLocaleDateString('pl-PL',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'});show(document.getElementById('todayStatus'),utcToday);const input=document.getElementById('date');input.value=fmt(utcToday);function selected(){if(input.value){show(document.getElementById('chosenStatus'),parse(input.value))}}input.addEventListener('change',()=>{selected();const d=parse(input.value);viewYear=d.getUTCFullYear();viewMonth=d.getUTCMonth();render()});selected();let viewYear=utcToday.getUTCFullYear(),viewMonth=utcToday.getUTCMonth();function render(){let first=new Date(Date.UTC(viewYear,viewMonth,1));document.getElementById('monthLabel').textContent=first.toLocaleDateString('pl-PL',{timeZone:'UTC',month:'long',year:'numeric'});let cal=document.getElementById('calendar');cal.replaceChildren();for(let w of ['Pn','Wt','Śr','Cz','Pt','So','Nd']){let e=document.createElement('div');e.className='weekday';e.textContent=w;cal.append(e)}let offset=(first.getUTCDay()+6)%7;for(let i=0;i<offset;i++)cal.append(document.createElement('div'));let count=new Date(Date.UTC(viewYear,viewMonth+1,0)).getUTCDate();for(let n=1;n<=count;n++){let d=new Date(Date.UTC(viewYear,viewMonth,n)),e=document.createElement('div');e.className='day '+(free(d)?'free':'work')+(fmt(d)===fmt(utcToday)?' today':'');e.textContent=n;e.addEventListener('click',()=>{input.value=fmt(d);selected()});cal.append(e)}}function move(delta){viewMonth+=delta;if(viewMonth<0){viewMonth=11;viewYear--}if(viewMonth>11){viewMonth=0;viewYear++}render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
